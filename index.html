<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3985f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<title>Mon Agent de Suivi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:linear-gradient(180deg,#eef6ff,#f8fbff);color:#10203c}
.app{max-width:520px;margin:auto;padding:25px 16px 110px}.header{display:flex;align-items:center;gap:15px;margin-bottom:20px}
.logo{width:55px;height:55px;border-radius:18px;background:#e1efff;display:flex;align-items:center;justify-content:center;font-size:30px}
h1{margin:0;font-size:27px}.date{color:#74819a;margin-top:5px}.card{background:#fff;border-radius:25px;padding:20px;margin-bottom:16px;box-shadow:0 8px 25px rgba(40,80,140,.10)}
.title{font-size:20px;font-weight:bold}.weight{font-size:58px;font-weight:bold;margin-top:8px}.unit{font-size:28px;color:#77849c}
.trend{color:#12a57d;font-size:20px;font-weight:bold}.weather{background:linear-gradient(135deg,#fff,#e8f4ff)}
.temp{font-size:45px;font-weight:bold;margin-top:10px}.muted{color:#74819a}.progress{height:16px;background:#dde6f0;border-radius:20px;overflow:hidden;margin-top:15px}
.progressBar{height:100%;width:72%;background:linear-gradient(90deg,#3985f7,#75aaff)}canvas{width:100%;height:210px}
.bluetooth{display:flex;align-items:center;gap:15px}.bticon{width:55px;height:55px;border-radius:17px;background:#dcf8f0;display:flex;align-items:center;justify-content:center;font-size:30px}
.status{font-size:14px;color:#7b8799}button{border:0;background:#3985f7;color:#fff;font-weight:bold;padding:13px 18px;border-radius:15px;margin-top:12px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e1e8f0}.nav{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;padding:12px;color:#8a96a8}
.active{color:#3985f7;font-weight:bold}dialog{border:0;border-radius:22px;padding:22px;width:90%;max-width:350px}input{width:100%;padding:14px;font-size:18px;border:1px solid #ccd7e5;border-radius:12px}
</style>
</head>
<body>
<div class="app">
<div class="header"><div class="logo">♡</div><div><h1>Mon Agent de Suivi</h1><div id="date" class="date"></div></div></div>
<div class="card"><div class="title">⚖ Poids</div><div><span id="weight" class="weight">62,4</span> <span class="unit">kg</span></div><div id="trend" class="trend">↓ -1,2 kg ce mois</div><button onclick="openWeight()">Ajouter le poids</button></div>
<div class="card"><div class="title">📊 Courbe du poids</div><canvas id="chart" width="800" height="420"></canvas></div>
<div class="card weather"><div class="title">☁ Météo</div><div id="temp" class="temp">--°C</div><div id="weatherText" class="muted">Appuie sur Actualiser</div><div id="weatherRange" class="muted">Max --° / Min --°</div><button onclick="loadWeather()">Actualiser la météo</button></div>
<div class="card"><div class="title">🎯 Objectif : 60 kg</div><div class="progress"><div id="progressBar" class="progressBar"></div></div><div id="progressText" class="muted" style="margin-top:10px">72 %</div></div>
<div class="card"><div class="bluetooth"><div class="bticon">ᛒ</div><div><div class="title">Balance Bluetooth</div><div id="btStatus" class="status">Non connectée</div></div></div><button onclick="connectBluetooth()">Connecter la balance</button></div>
</div>
<div class="bottom"><div class="nav"><div class="active">⌂<br>Accueil</div><div>▥<br>Statistiques</div><div>♡<br>Conseils</div><div>⚙<br>Paramètres</div></div></div>
<dialog id="weightDialog"><h2>Ajouter le poids</h2><input id="weightInput" type="number" step="0.1" placeholder="Exemple : 62.4"><button onclick="saveWeight()">Enregistrer</button><button onclick="weightDialog.close()" style="background:#8895a8">Annuler</button></dialog>
<script>
let weights=JSON.parse(localStorage.getItem("weights")||"[65.2,64.8,64.4,63.8,63.3,63.0,62.7,62.4]");
function updateClock(){let d=new Date();let dd=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});let t=d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});date.innerText=dd+"   "+t}
setInterval(updateClock,1000);updateClock();
function refresh(){let current=weights[weights.length-1],diff=current-weights[0];weight.innerText=current.toFixed(1).replace(".",",");trend.innerText=(diff<=0?"↓ ":"↑ +")+Math.abs(diff).toFixed(1).replace(".",",")+" kg ce mois";let goal=60,start=weights[0];let pct=Math.max(0,Math.min(100,Math.round(((start-current)/(start-goal))*100)));progressBar.style.width=pct+"%";progressText.innerText=pct+" %";drawChart()}
function openWeight(){weightInput.value="";weightDialog.showModal()}
function saveWeight(){let v=parseFloat(weightInput.value);if(!v)return alert("Entre un poids valide");weights.push(v);if(weights.length>30)weights.shift();localStorage.setItem("weights",JSON.stringify(weights));weightDialog.close();refresh()}
function drawChart(){let c=chart,x=c.getContext("2d"),W=c.width,H=c.height,p=50,min=Math.min(...weights)-1,max=Math.max(...weights)+1;x.clearRect(0,0,W,H);x.strokeStyle="#dce7f5";x.lineWidth=2;for(let i=0;i<5;i++){let y=p+i*(H-p*2)/4;x.beginPath();x.moveTo(p,y);x.lineTo(W-p,y);x.stroke()}x.beginPath();weights.forEach((v,i)=>{let xx=p+i*(W-p*2)/(weights.length-1),yy=p+(max-v)*(H-p*2)/(max-min);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.strokeStyle="#3985f7";x.lineWidth=7;x.lineJoin="round";x.stroke()}
function loadWeather(){weatherText.innerText="Localisation...";navigator.geolocation.getCurrentPosition(async p=>{try{let u=`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;let d=await (await fetch(u)).json();let m={0:"Ciel dégagé",1:"Plutôt dégagé",2:"Partiellement nuageux",3:"Nuageux",45:"Brouillard",61:"Pluie faible",63:"Pluie",65:"Pluie forte",71:"Neige",80:"Averses",95:"Orage"};temp.innerText=Math.round(d.current.temperature_2m)+"°C";weatherText.innerText=m[d.current.weather_code]||"Météo";weatherRange.innerText=`Max ${Math.round(d.daily.temperature_2m_max[0])}° / Min ${Math.round(d.daily.temperature_2m_min[0])}°`}catch(e){weatherText.innerText="Météo indisponible"}},()=>weatherText.innerText="Autorise la localisation")}
async function connectBluetooth(){if(!navigator.bluetooth){btStatus.innerText="Bluetooth Web indisponible";return alert("Utilise Chrome sur Android ou Chrome sur PC avec Web Bluetooth.");}try{btStatus.innerText="Recherche...";let d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:["battery_service"]});btStatus.innerText="Détectée : "+(d.name||"appareil Bluetooth");try{await d.gatt.connect();btStatus.innerText="Connectée : "+(d.name||"balance")}catch(e){}}catch(e){btStatus.innerText="Connexion annulée"}}
refresh();
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{})}
</script>
</body></html>
